
name: sale_pipeline_business
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # Routing
  go_router: ^18.0.2

  # Riverpod
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Network
  dio: ^5.8.0+1

  # HTTP
  http: ^1.4.0

  # Cached Network Image
  cached_network_image: ^4.0.4

  # Local Storage
  get_storage: ^2.1.1

  # UI Components
  flutter_spinkit: ^5.2.1
  dropdown_button2: ^3.1.0
  flutter_bounceable: ^1.2.0
  loading_indicator: ^4.0.2

  # Validation
  email_validator: ^3.0.0

  # WebView
  webview_flutter: ^4.13.1

  # Firebase
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_analytics: ^12.6.0
  flutter_local_notifications: ^22.3.2

  # Image Picker
  image_picker: any

  # PIN Code
  pin_code_fields: ^10.1.1

  # Phone Number
  intl_phone_field: ^3.2.0

  # QR Code
  qr_flutter: ^4.1.0

  # Environment Variables
  envied: ^1.3.1

  # Internet Connectivity
  internet_connection_checker_plus: ^3.1.2
  connectivity_plus: ^7.0.0

  # Date and Time
  intl: ^0.20.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # File and Gallery
  path_provider: ^2.1.5
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.15.1

  # Riverpod Code Generation
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  custom_lint: ^0.8.1

  # Environment Generator
  envied_generator: ^1.3.10

flutter:
  uses-material-design: true

  generate: true

  # Local Assets
  assets:
    - assets/images/

  # Local Fonts
  fonts:
    - family: FuturuRegular
      fonts:
        - asset: fonts/futuru-regular.ttf
